services:
  postgres:
    image: postgres:16-alpine
    container_name: luma-postgres
    environment:
      POSTGRES_USER: luma
      POSTGRES_PASSWORD: luma_dev_password
      POSTGRES_DB: luma
    ports:
      - "5432:5432"
    volumes:
      - luma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luma -d luma"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  luma_pgdata:
